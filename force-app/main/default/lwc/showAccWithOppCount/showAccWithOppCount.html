<template>
    <template lwc:if={ifAccountsPresent}>  
        <div style="height: 300px;">
            <lightning-datatable
                    key-field="accId"
                    data={accounts.data}
                    columns={columns}
                    hide-checkbox-column=true
                    show-row-number-column=true
                    onrowaction={handleRowAction}>
            </lightning-datatable>
        </div>
    </template>
    <template lwc:else>
        <p>You do not own any accounts</p>
    </template>
</template>
